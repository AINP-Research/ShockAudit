name: Verify live ShockAudit MCP

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: shockaudit-live-mcp
  # Production verification and its evidence write are never superseded.
  cancel-in-progress: false

jobs:
  verify-production:
    name: Repeated production MCP contract
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    # Allow the full twenty-minute deployment wait plus five durable Find/Audit
    # rounds (whose bounded official-source paths can each take several
    # minutes) and evidence upload without racing the job timeout.
    timeout-minutes: 90

    steps:
      - name: Download repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact verifier dependencies
        run: timeout 5m npm ci --no-audit

      - name: Wait for deployment and verify production repeatedly
        id: verify_live_production
        run: >-
          timeout 80m node scripts/verify-live-mcp.mjs
          --wait 1200
          --evidence-dir artifacts/stage6-live
        env:
          SHOCKAUDIT_EXPECTED_COMMIT: ${{ github.sha }}

      - name: Prepare bounded Stage 6 live evidence
        id: prepare_live_evidence
        if: ${{ always() && !cancelled() }}
        run: >-
          timeout 1m node scripts/manage-actions-evidence.mjs prepare
          --profile live
          --source-root "$GITHUB_WORKSPACE"
          --stage-root "$RUNNER_TEMP/shockaudit-live-evidence"
          --runner-temp "$RUNNER_TEMP"
          --expected-sha "$GITHUB_SHA"
          --repository "$GITHUB_REPOSITORY"
          --run-id "$GITHUB_RUN_ID"
          --run-attempt "$GITHUB_RUN_ATTEMPT"
          --retention-days 90

      - name: Upload bounded Stage 6 live evidence
        id: upload_live_evidence
        if: ${{ always() && !cancelled() && steps.prepare_live_evidence.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: stage6-live-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ steps.prepare_live_evidence.outputs.stage_root }}/
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

      - name: Inspect and download Stage 6 artifact by ID
        if: ${{ always() && !cancelled() && steps.upload_live_evidence.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHOCKAUDIT_ARTIFACT_ID: ${{ steps.upload_live_evidence.outputs.artifact-id }}
          SHOCKAUDIT_ARTIFACT_DIGEST: ${{ steps.upload_live_evidence.outputs.artifact-digest }}
          SHOCKAUDIT_ARTIFACT_NAME: stage6-live-evidence-${{ github.sha }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          metadata="$RUNNER_TEMP/shockaudit-live-artifact.json"
          archive="$RUNNER_TEMP/shockaudit-live-artifact.zip"
          destination="$RUNNER_TEMP/shockaudit-live-evidence-download"
          test ! -e "$destination"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$SHOCKAUDIT_ARTIFACT_ID" > "$metadata"
          node --input-type=module -e "import { appendFileSync, readFileSync } from 'node:fs'; const value=JSON.parse(readFileSync(process.argv[1], 'utf8')); const actionDigest=process.env.SHOCKAUDIT_ARTIFACT_DIGEST; const normalized=/^[0-9a-f]{64}$/.test(actionDigest) ? 'sha256:'+actionDigest : actionDigest; const valid=/^sha256:[0-9a-f]{64}$/.test(normalized) && String(value.id)===process.env.SHOCKAUDIT_ARTIFACT_ID && value.name===process.env.SHOCKAUDIT_ARTIFACT_NAME && value.digest===normalized && value.expired===false && String(value.workflow_run?.id)===process.env.GITHUB_RUN_ID && value.workflow_run?.head_sha===process.env.GITHUB_SHA && Number.isSafeInteger(value.size_in_bytes) && value.size_in_bytes>0; if (!valid) throw new Error('Uploaded live artifact metadata is not bound to this exact SHA/run/name/digest.'); appendFileSync(process.env.GITHUB_STEP_SUMMARY, '- Uploaded artifact ID: '+value.id+'; stored bytes: '+value.size_in_bytes+'; expires: '+value.expires_at+'\n');" "$metadata"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$SHOCKAUDIT_ARTIFACT_ID/zip" > "$archive"
          test -s "$archive"
          action_digest="${SHOCKAUDIT_ARTIFACT_DIGEST#sha256:}"
          test "${#action_digest}" -eq 64
          test "$(sha256sum "$archive" | cut -d ' ' -f 1)" = "$action_digest"
          while IFS= read -r entry; do
            test -n "$entry"
            case "$entry" in
              /*|*\\*|..|../*|*/../*|*/..) exit 1 ;;
            esac
          done < <(unzip -Z1 "$archive")
          mkdir "$destination"
          unzip -qq "$archive" -d "$destination"

      - name: Verify downloaded Stage 6 live evidence
        if: ${{ always() && !cancelled() && steps.upload_live_evidence.outcome == 'success' }}
        run: >-
          timeout 1m node scripts/manage-actions-evidence.mjs verify
          --profile live
          --stage-root "$RUNNER_TEMP/shockaudit-live-evidence-download"
          --runner-temp "$RUNNER_TEMP"
          --expected-sha "$GITHUB_SHA"
          --repository "$GITHUB_REPOSITORY"
          --run-id "$GITHUB_RUN_ID"
          --run-attempt "$GITHUB_RUN_ATTEMPT"
          --retention-days 90

      - name: Report bounded repository artifact inventory
        if: ${{ always() && !cancelled() && steps.upload_live_evidence.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SHOCKAUDIT_ARTIFACT_ID: ${{ steps.upload_live_evidence.outputs.artifact-id }}
          SHOCKAUDIT_ARTIFACT_DIGEST: ${{ steps.upload_live_evidence.outputs.artifact-digest }}
          SHOCKAUDIT_ARTIFACT_NAME: stage6-live-evidence-${{ github.sha }}-${{ github.run_attempt }}
        run: >-
          timeout 1m node scripts/manage-actions-evidence.mjs report-inventory
          --repository "$GITHUB_REPOSITORY"
          --expected-sha "$GITHUB_SHA"
          --run-id "$GITHUB_RUN_ID"
          --uploaded-artifact-id "$SHOCKAUDIT_ARTIFACT_ID"
          --uploaded-artifact-name "$SHOCKAUDIT_ARTIFACT_NAME"
          --uploaded-artifact-digest "$SHOCKAUDIT_ARTIFACT_DIGEST"

  verify-production-matrix:
    name: Complete production Screen 2 and Screen 3 matrix
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    # Keep the full documented matrix bound plus dependency installation and
    # evidence upload separate from the five-round live verifier's budget.
    timeout-minutes: 160

    steps:
      - name: Download repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact verifier dependencies
        run: timeout 5m npm ci --no-audit

      - name: Wait for deployment and verify all 22 production cases
        id: verify_production_matrix
        run: >-
          timeout 150m node scripts/verify-production-matrix.mjs
          --suite all
          --wait 1200
          --evidence-dir artifacts/production-matrix
        env:
          SHOCKAUDIT_EXPECTED_COMMIT: ${{ github.sha }}

      - name: Prepare bounded production matrix evidence
        id: prepare_matrix_evidence
        if: ${{ always() && !cancelled() }}
        run: >-
          timeout 1m node scripts/manage-actions-evidence.mjs prepare
          --profile matrix
          --source-root "$GITHUB_WORKSPACE"
          --stage-root "$RUNNER_TEMP/shockaudit-matrix-evidence"
          --runner-temp "$RUNNER_TEMP"
          --expected-sha "$GITHUB_SHA"
          --repository "$GITHUB_REPOSITORY"
          --run-id "$GITHUB_RUN_ID"
          --run-attempt "$GITHUB_RUN_ATTEMPT"
          --retention-days 90

      - name: Upload bounded production matrix evidence
        id: upload_matrix_evidence
        if: ${{ always() && !cancelled() && steps.prepare_matrix_evidence.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: production-matrix-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ steps.prepare_matrix_evidence.outputs.stage_root }}/
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

      - name: Inspect and download production matrix artifact by ID
        if: ${{ always() && !cancelled() && steps.upload_matrix_evidence.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHOCKAUDIT_ARTIFACT_ID: ${{ steps.upload_matrix_evidence.outputs.artifact-id }}
          SHOCKAUDIT_ARTIFACT_DIGEST: ${{ steps.upload_matrix_evidence.outputs.artifact-digest }}
          SHOCKAUDIT_ARTIFACT_NAME: production-matrix-${{ github.sha }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          metadata="$RUNNER_TEMP/shockaudit-matrix-artifact.json"
          archive="$RUNNER_TEMP/shockaudit-matrix-artifact.zip"
          destination="$RUNNER_TEMP/shockaudit-matrix-evidence-download"
          test ! -e "$destination"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$SHOCKAUDIT_ARTIFACT_ID" > "$metadata"
          node --input-type=module -e "import { appendFileSync, readFileSync } from 'node:fs'; const value=JSON.parse(readFileSync(process.argv[1], 'utf8')); const actionDigest=process.env.SHOCKAUDIT_ARTIFACT_DIGEST; const normalized=/^[0-9a-f]{64}$/.test(actionDigest) ? 'sha256:'+actionDigest : actionDigest; const valid=/^sha256:[0-9a-f]{64}$/.test(normalized) && String(value.id)===process.env.SHOCKAUDIT_ARTIFACT_ID && value.name===process.env.SHOCKAUDIT_ARTIFACT_NAME && value.digest===normalized && value.expired===false && String(value.workflow_run?.id)===process.env.GITHUB_RUN_ID && value.workflow_run?.head_sha===process.env.GITHUB_SHA && Number.isSafeInteger(value.size_in_bytes) && value.size_in_bytes>0; if (!valid) throw new Error('Uploaded matrix artifact metadata is not bound to this exact SHA/run/name/digest.'); appendFileSync(process.env.GITHUB_STEP_SUMMARY, '- Uploaded artifact ID: '+value.id+'; stored bytes: '+value.size_in_bytes+'; expires: '+value.expires_at+'\n');" "$metadata"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$SHOCKAUDIT_ARTIFACT_ID/zip" > "$archive"
          test -s "$archive"
          action_digest="${SHOCKAUDIT_ARTIFACT_DIGEST#sha256:}"
          test "${#action_digest}" -eq 64
          test "$(sha256sum "$archive" | cut -d ' ' -f 1)" = "$action_digest"
          while IFS= read -r entry; do
            test -n "$entry"
            case "$entry" in
              /*|*\\*|..|../*|*/../*|*/..) exit 1 ;;
            esac
          done < <(unzip -Z1 "$archive")
          mkdir "$destination"
          unzip -qq "$archive" -d "$destination"

      - name: Verify downloaded production matrix evidence
        if: ${{ always() && !cancelled() && steps.upload_matrix_evidence.outcome == 'success' }}
        run: >-
          timeout 1m node scripts/manage-actions-evidence.mjs verify
          --profile matrix
          --stage-root "$RUNNER_TEMP/shockaudit-matrix-evidence-download"
          --runner-temp "$RUNNER_TEMP"
          --expected-sha "$GITHUB_SHA"
          --repository "$GITHUB_REPOSITORY"
          --run-id "$GITHUB_RUN_ID"
          --run-attempt "$GITHUB_RUN_ATTEMPT"
          --retention-days 90

      - name: Report bounded repository artifact inventory
        if: ${{ always() && !cancelled() && steps.upload_matrix_evidence.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SHOCKAUDIT_ARTIFACT_ID: ${{ steps.upload_matrix_evidence.outputs.artifact-id }}
          SHOCKAUDIT_ARTIFACT_DIGEST: ${{ steps.upload_matrix_evidence.outputs.artifact-digest }}
          SHOCKAUDIT_ARTIFACT_NAME: production-matrix-${{ github.sha }}-${{ github.run_attempt }}
        run: >-
          timeout 1m node scripts/manage-actions-evidence.mjs report-inventory
          --repository "$GITHUB_REPOSITORY"
          --expected-sha "$GITHUB_SHA"
          --run-id "$GITHUB_RUN_ID"
          --uploaded-artifact-id "$SHOCKAUDIT_ARTIFACT_ID"
          --uploaded-artifact-name "$SHOCKAUDIT_ARTIFACT_NAME"
          --uploaded-artifact-digest "$SHOCKAUDIT_ARTIFACT_DIGEST"
