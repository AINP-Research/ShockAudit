name: Release Screen 1

on:
  create:

permissions:
  contents: write
  actions: read

concurrency:
  group: release-screen-1-v0.1.1
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.ref_type == 'branch' &&
      github.event.ref == 'release/screen-1-v0.1.1'
    name: Publish v0.1.1
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download the release target
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Identify the branch target
        id: target
        run: |
          target_sha="$(git rev-parse HEAD)"
          test "$target_sha" = "$GITHUB_SHA"
          echo "sha=$target_sha" >> "$GITHUB_OUTPUT"

      - name: Verify main, version, and successful CI
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          git fetch --force origin main
          test "$(git rev-parse origin/main)" = "$TARGET_SHA"

          version="$(git show "$TARGET_SHA:package.json" | node -e "let data=''; process.stdin.on('data', chunk => data += chunk).on('end', () => console.log(JSON.parse(data).version))")"
          test "$version" = "0.1.1"

          successful_runs="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$TARGET_SHA&event=push&status=completed&per_page=100" \
            --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')"
          test "$successful_runs" -gt 0

      - name: Verify the exact production deployment
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          production_url="https://shockaudit.ainp-research.workers.dev"
          health="$(curl --fail --silent --show-error \
            --retry 6 --retry-delay 5 --retry-all-errors \
            -H "Cache-Control: no-cache" \
            "$production_url/health?release-check=$TARGET_SHA")"
          HEALTH="$health" node -e "
            const value = JSON.parse(process.env.HEALTH);
            if (value.ok !== true || value.service !== 'ShockAudit' || value.version !== '0.1.1') {
              process.exit(1);
            }
          "

          short_sha="$(printf '%s' "$TARGET_SHA" | cut -c1-7)"
          html="$(curl --fail --silent --show-error \
            --retry 6 --retry-delay 5 --retry-all-errors \
            -H "Cache-Control: no-cache" \
            "$production_url/?release-check=$TARGET_SHA")"
          grep -Fq "commit/$short_sha" <<< "$html"

      - name: Publish frozen Screen 1 checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          git fetch --force origin main
          test "$(git rev-parse origin/main)" = "$TARGET_SHA"
          git fetch --force --tags
          tag_sha="$(git rev-list -n 1 v0.1.1 2>/dev/null || true)"

          if [ -n "$tag_sha" ] && [ "$tag_sha" != "$TARGET_SHA" ]; then
            echo "v0.1.1 points to $tag_sha, not the verified commit $TARGET_SHA."
            exit 1
          fi

          if gh release view v0.1.1 >/dev/null 2>&1; then
            test "$tag_sha" = "$TARGET_SHA"
            echo "v0.1.1 already points to the verified Screen 1 checkpoint."
            exit 0
          fi

          sed "s/{{COMMIT_SHA}}/$TARGET_SHA/g" \
            .github/releases/v0.1.1.md > "$RUNNER_TEMP/v0.1.1.md"

          if [ -n "$tag_sha" ]; then
            gh release create v0.1.1 \
              --title "ShockAudit Screen 1 — v0.1.1" \
              --notes-file "$RUNNER_TEMP/v0.1.1.md" \
              --latest
            exit 0
          fi

          gh release create v0.1.1 \
            --target "$TARGET_SHA" \
            --title "ShockAudit Screen 1 — v0.1.1" \
            --notes-file "$RUNNER_TEMP/v0.1.1.md" \
            --latest
