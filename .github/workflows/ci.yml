name: Check ShockAudit

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  push:
    branches:
      - main

permissions:
  contents: read

# Superseded PR checks may stop. Push/main work, including production evidence,
# is never cancelled by this workflow.
concurrency:
  group: shockaudit-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-audits:
    name: Dependency audit (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: runtime
          - label: full
    env:
      SHOCKAUDIT_EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Download exact source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Pin the supported npm audit client
        run: |
          set -euo pipefail
          timeout 10m npm install --global npm@11.19.1 --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org/
          hash -r
          test "$(npm --version)" = "11.19.1"

      - name: Install exact dependencies
        run: timeout 10m npm ci --no-audit

      - name: Audit runtime dependencies
        if: ${{ matrix.label == 'runtime' }}
        run: timeout 10m npm run audit:runtime

      - name: Audit full dependencies
        if: ${{ matrix.label == 'full' }}
        run: timeout 20m npm run audit:full

      - name: Verify exact audit source tree remained unchanged
        if: ${{ !cancelled() }}
        run: |
          test "$(git rev-parse HEAD)" = "$SHOCKAUDIT_EXPECTED_COMMIT"
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

  test-and-build:
    name: Exact-HEAD release gates
    needs: dependency-audits
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    env:
      SHOCKAUDIT_EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Download exact source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Reject whitespace errors across the release diff
        env:
          SHOCKAUDIT_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git cat-file -e "${SHOCKAUDIT_DIFF_BASE}^{commit}" 2>/dev/null; then
            git diff --check "$SHOCKAUDIT_DIFF_BASE" "$SHOCKAUDIT_EXPECTED_COMMIT"
          else
            git diff --check HEAD^ HEAD
          fi

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install exact dependencies
        run: timeout 10m npm ci --no-audit

      - name: Run regression-sensitive unit and contract tests
        run: timeout 10m npm run test:release

      - name: Compile and verify production artifact
        env:
          SHOCKAUDIT_EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: timeout 6m npm run build

      - name: Validate frozen generalization benchmarks
        run: timeout 2m npm run check:benchmarks

      - name: Validate catalog and schema budgets
        run: timeout 2m npm run check:catalog-schema

      - name: Reject prohibited production paths
        run: timeout 2m npm run check:static-prohibited

      - name: Verify release-support syntax and fixtures
        run: |
          timeout 1m node --check scripts/verify-stage6-evidence.mjs
          timeout 1m node --check scripts/verify-live-mcp.mjs
          timeout 1m node --check scripts/verify-production-branch.mjs
          timeout 1m node --check scripts/run-lockfile-audit.mjs
          timeout 1m node --check scripts/write-release-gate-evidence.mjs
          timeout 1m node --check scripts/verify-production-matrix.mjs
          timeout 1m node --check scripts/manage-actions-evidence.mjs
          timeout 1m node --input-type=module -e "import { readEvidencePolicy } from './scripts/manage-actions-evidence.mjs'; await readEvidencePolicy();"
          timeout 1m node scripts/verify-live-mcp.mjs --help
          timeout 1m node scripts/verify-production-matrix.mjs --list
          timeout 1m node --input-type=module -e "import { readFile } from 'node:fs/promises'; const cases = JSON.parse(await readFile('scripts/production-matrix-cases.json', 'utf8')); if (!Array.isArray(cases.screen2) || !Array.isArray(cases.screen3) || cases.screen2.length !== 11 || cases.screen3.length !== 11) throw new Error('Expected exactly 11 Screen 2 and 11 Screen 3 production matrix cases.');"
          timeout 1m node --input-type=module -e "import { readFile } from 'node:fs/promises'; JSON.parse(await readFile('docs/evidence/STAGE-6-RUN-MANIFEST.template.json', 'utf8'));"
          timeout 1m node --input-type=module -e "import { readFile } from 'node:fs/promises'; JSON.parse(await readFile('docs/evidence/STAGE-6-NEGATIVE-SECURITY-CONTROL.template.json', 'utf8'));"

      - name: Discover bounded browser suite
        run: timeout 2m npm run test:browser:list

      - name: Install Chromium for browser acceptance
        timeout-minutes: 8
        run: npx playwright install --with-deps chromium

      - name: Run Wrangler browser runtime smoke
        id: wrangler_browser_smoke
        timeout-minutes: 4
        env:
          SHOCKAUDIT_BROWSER_GATE_KIND: wrangler-smoke
          SHOCKAUDIT_PLAYWRIGHT_REPORT: artifacts/release-gates/wrangler-smoke-results.json
          WRANGLER_LOG: debug
          WRANGLER_LOG_PATH: artifacts/browser-diagnostics/wrangler-smoke-debug.log
          WRANGLER_LOG_SANITIZE: "true"
          WRANGLER_SEND_ERROR_REPORTS: "false"
          WRANGLER_SEND_METRICS: "false"
        run: |
          mkdir -p artifacts/release-gates artifacts/browser-diagnostics
          ./node_modules/.bin/playwright test \
            tests/browser/six-screen-screen01-screen02.spec.ts \
            --project=chromium \
            --grep "Order 841 opens the study-first Screen 2 handoff and restores useful Screen 3 guidance"

      # The complete suite uses the deterministic HTTP fixture for bounded,
      # repeatable coverage. The preceding exact-head replacement smoke also
      # verifies the real Wrangler runtime and an official-source transport.
      - name: Run MCP Apps browser and accessibility acceptance
        id: browser_accessibility
        timeout-minutes: 15
        env:
          SHOCKAUDIT_BROWSER_BASE_URL: http://127.0.0.1:8791
          SHOCKAUDIT_BROWSER_GATE_KIND: browser-accessibility-execution
          SHOCKAUDIT_BROWSER_NODE_FIXTURE: "1"
          SHOCKAUDIT_PLAYWRIGHT_REPORT: test-results/playwright-results.json
        run: npm run test:browser

      - name: Verify curated browser evidence is complete
        id: verify_curated_browser_evidence
        run: |
          set -euo pipefail
          screenshot_dir="artifacts/release-gates/screenshots"
          test -d "$screenshot_dir"
          checksum_file="artifacts/release-gates/browser-success-screenshots.sha256"
          : > "$checksum_file"
          for screenshot in \
            simulated-six-screen-screen01-order841-identity.png \
            simulated-six-screen-screen03-order841-restored.png \
            simulated-six-screen-screen01-ccpa-match.png \
            simulated-six-screen-screen02-ccpa-retained-evidence.png \
            simulated-six-screen-screen03-ccpa-study-first.png \
            simulated-six-screen-screen01-ccpa-minimal-entry.png \
            simulated-six-screen-screen01-ccpa-minimal-match-sidebar.png \
            simulated-six-screen-screen02-ccpa-minimal-confirmed.png \
            simulated-six-screen-screen02-ccpa-minimal-narrow-navigation.png \
            simulated-six-screen-screen01-unsupported-jurisdiction.png
          do
            test -f "$screenshot_dir/$screenshot"
            test ! -L "$screenshot_dir/$screenshot"
            test -s "$screenshot_dir/$screenshot"
            (cd "$screenshot_dir" && sha256sum "$screenshot") >> "$checksum_file"
          done
          test "$(wc -l < "$checksum_file")" -eq 10

      - name: Verify production Cloudflare bundle only
        run: timeout 4m npx wrangler deploy --dry-run

      - name: Verify exact source tree remained unchanged
        run: |
          test "$(git rev-parse HEAD)" = "$SHOCKAUDIT_EXPECTED_COMMIT"
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Record exact-HEAD release gate evidence
        id: record_release_evidence
        if: >-
          ${{ success() && needs.dependency-audits.result == 'success' &&
              github.event_name == 'pull_request' &&
              contains(github.event.pull_request.body, '<!-- shockaudit-final-candidate-evidence:v0.6.2 -->') }}
        run: timeout 1m node scripts/write-release-gate-evidence.mjs

      - name: Prepare bounded exact-HEAD release evidence
        id: prepare_release_evidence
        if: >-
          ${{ success() && needs.dependency-audits.result == 'success' &&
              github.event_name == 'pull_request' &&
              contains(github.event.pull_request.body, '<!-- shockaudit-final-candidate-evidence:v0.6.2 -->') }}
        run: >-
          timeout 1m node scripts/manage-actions-evidence.mjs prepare
          --profile release
          --source-root "$GITHUB_WORKSPACE"
          --stage-root "$RUNNER_TEMP/shockaudit-release-evidence"
          --runner-temp "$RUNNER_TEMP"
          --expected-sha "$SHOCKAUDIT_EXPECTED_COMMIT"
          --repository "$GITHUB_REPOSITORY"
          --run-id "$GITHUB_RUN_ID"
          --run-attempt "$GITHUB_RUN_ATTEMPT"
          --retention-days 90
          --final-candidate-sha "$SHOCKAUDIT_EXPECTED_COMMIT"

      - name: Upload bounded exact-HEAD release evidence
        id: upload_release_evidence
        if: ${{ success() && steps.prepare_release_evidence.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-gates-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: ${{ steps.prepare_release_evidence.outputs.stage_root }}/
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

      - name: Inspect and download exact release artifact by ID
        if: ${{ success() && steps.upload_release_evidence.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHOCKAUDIT_ARTIFACT_ID: ${{ steps.upload_release_evidence.outputs.artifact-id }}
          SHOCKAUDIT_ARTIFACT_DIGEST: ${{ steps.upload_release_evidence.outputs.artifact-digest }}
          SHOCKAUDIT_ARTIFACT_NAME: release-gates-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          metadata="$RUNNER_TEMP/shockaudit-release-artifact.json"
          archive="$RUNNER_TEMP/shockaudit-release-artifact.zip"
          destination="$RUNNER_TEMP/shockaudit-release-evidence-download"
          test ! -e "$destination"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$SHOCKAUDIT_ARTIFACT_ID" > "$metadata"
          node --input-type=module -e "import { appendFileSync, readFileSync } from 'node:fs'; const value=JSON.parse(readFileSync(process.argv[1], 'utf8')); const actionDigest=process.env.SHOCKAUDIT_ARTIFACT_DIGEST; const normalized=/^[0-9a-f]{64}$/.test(actionDigest) ? 'sha256:'+actionDigest : actionDigest; const valid=/^sha256:[0-9a-f]{64}$/.test(normalized) && String(value.id)===process.env.SHOCKAUDIT_ARTIFACT_ID && value.name===process.env.SHOCKAUDIT_ARTIFACT_NAME && value.digest===normalized && value.expired===false && String(value.workflow_run?.id)===process.env.GITHUB_RUN_ID && value.workflow_run?.head_sha===process.env.SHOCKAUDIT_EXPECTED_COMMIT && Number.isSafeInteger(value.size_in_bytes) && value.size_in_bytes>0; if (!valid) throw new Error('Uploaded release artifact metadata is not bound to this exact SHA/run/name/digest.'); appendFileSync(process.env.GITHUB_STEP_SUMMARY, '- Uploaded artifact ID: '+value.id+'; stored bytes: '+value.size_in_bytes+'; expires: '+value.expires_at+'\n');" "$metadata"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$SHOCKAUDIT_ARTIFACT_ID/zip" > "$archive"
          test -s "$archive"
          action_digest="${SHOCKAUDIT_ARTIFACT_DIGEST#sha256:}"
          test "${#action_digest}" -eq 64
          test "$(sha256sum "$archive" | cut -d ' ' -f 1)" = "$action_digest"
          while IFS= read -r entry; do
            test -n "$entry"
            case "$entry" in
              /*|*\\*|..|../*|*/../*|*/..) exit 1 ;;
            esac
          done < <(unzip -Z1 "$archive")
          mkdir "$destination"
          unzip -qq "$archive" -d "$destination"

      - name: Verify downloaded exact-HEAD release evidence
        if: ${{ success() && steps.upload_release_evidence.outcome == 'success' }}
        run: >-
          timeout 1m node scripts/manage-actions-evidence.mjs verify
          --profile release
          --stage-root "$RUNNER_TEMP/shockaudit-release-evidence-download"
          --runner-temp "$RUNNER_TEMP"
          --expected-sha "$SHOCKAUDIT_EXPECTED_COMMIT"
          --repository "$GITHUB_REPOSITORY"
          --run-id "$GITHUB_RUN_ID"
          --run-attempt "$GITHUB_RUN_ATTEMPT"
          --retention-days 90
          --final-candidate-sha "$SHOCKAUDIT_EXPECTED_COMMIT"

      - name: Report bounded repository artifact inventory
        if: ${{ success() && steps.upload_release_evidence.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SHOCKAUDIT_ARTIFACT_ID: ${{ steps.upload_release_evidence.outputs.artifact-id }}
          SHOCKAUDIT_ARTIFACT_DIGEST: ${{ steps.upload_release_evidence.outputs.artifact-digest }}
          SHOCKAUDIT_ARTIFACT_NAME: release-gates-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
        run: >-
          timeout 1m node scripts/manage-actions-evidence.mjs report-inventory
          --repository "$GITHUB_REPOSITORY"
          --expected-sha "$SHOCKAUDIT_EXPECTED_COMMIT"
          --run-id "$GITHUB_RUN_ID"
          --uploaded-artifact-id "$SHOCKAUDIT_ARTIFACT_ID"
          --uploaded-artifact-name "$SHOCKAUDIT_ARTIFACT_NAME"
          --uploaded-artifact-digest "$SHOCKAUDIT_ARTIFACT_DIGEST"

      - name: Prepare relevant browser failure diagnostics
        id: prepare_browser_diagnostics
        if: >-
          ${{ failure() && !cancelled() &&
              (steps.wrangler_browser_smoke.conclusion == 'failure' ||
               steps.browser_accessibility.conclusion == 'failure' ||
               steps.verify_curated_browser_evidence.conclusion == 'failure' ||
               steps.record_release_evidence.conclusion == 'failure' ||
               steps.prepare_release_evidence.conclusion == 'failure') }}
        env:
          SHOCKAUDIT_ACTIVE_DIAGNOSTICS_SHA: >-
            ${{ github.event_name == 'pull_request' &&
                contains(github.event.pull_request.body, format('<!-- shockaudit-active-diagnostics:{0} -->', github.event.pull_request.head.sha)) &&
                github.event.pull_request.head.sha || '' }}
          SHOCKAUDIT_DIAGNOSTICS_RETENTION_DAYS: >-
            ${{ github.event_name == 'pull_request' &&
                contains(github.event.pull_request.body, format('<!-- shockaudit-active-diagnostics:{0} -->', github.event.pull_request.head.sha)) &&
                '7' || '3' }}
        run: >-
          timeout 1m node scripts/manage-actions-evidence.mjs prepare
          --profile diagnostics
          --source-root "$GITHUB_WORKSPACE"
          --stage-root "$RUNNER_TEMP/shockaudit-browser-diagnostics"
          --runner-temp "$RUNNER_TEMP"
          --expected-sha "$SHOCKAUDIT_EXPECTED_COMMIT"
          --repository "$GITHUB_REPOSITORY"
          --run-id "$GITHUB_RUN_ID"
          --run-attempt "$GITHUB_RUN_ATTEMPT"
          --retention-days "$SHOCKAUDIT_DIAGNOSTICS_RETENTION_DAYS"
          --active-diagnostics-sha "$SHOCKAUDIT_ACTIVE_DIAGNOSTICS_SHA"

      - name: Upload bounded browser failure diagnostics
        if: ${{ always() && !cancelled() && steps.prepare_browser_diagnostics.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.prepare_browser_diagnostics.outputs.stage_root }}/
          if-no-files-found: error
          retention-days: ${{ steps.prepare_browser_diagnostics.outputs.retention_days }}
          compression-level: 9

      - name: Require both dependency audits before release
        if: ${{ always() }}
        env:
          SHOCKAUDIT_DEPENDENCY_AUDIT_RESULT: ${{ needs.dependency-audits.result }}
        run: test "$SHOCKAUDIT_DEPENDENCY_AUDIT_RESULT" = "success"
